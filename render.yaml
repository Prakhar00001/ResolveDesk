# Free web service; durable data lives in a separate Neon Free PostgreSQL project.
# Supply Neon's connection URI privately in Render, never in this file.
services:
  - type: web
    name: resolvedesk
    runtime: python
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r backend/requirements.txt && npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: python backend/start.py
    healthCheckPath: /healthz

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: NODE_VERSION
        value: "24"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_POSTGRES
        value: "true"
      - key: APP_ACCESS_USERNAME
        value: reviewer
      - key: APP_ACCESS_PASSWORD
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
