# Paid compute + persistent disk: review the Render cost estimate before applying.
# All traffic goes to one native Python service; its build also compiles React.
services:
  - type: web
    name: resolvedesk
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r backend/requirements.txt && npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: python backend/start.py
    healthCheckPath: /healthz
    disk:
      name: resolvedesk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: NODE_VERSION
        value: "24"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/resolvedesk.db
      - key: APP_ACCESS_USERNAME
        value: reviewer
      - key: APP_ACCESS_PASSWORD
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
