name: PostgreSQL compatibility

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - render.yaml
      - .github/workflows/postgres.yml
  pull_request:
    paths:
      - backend/**
      - render.yaml
      - .github/workflows/postgres.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: resolvedesk_test
          POSTGRES_USER: postgres
          # Disposable CI database only, never a hosted application credential.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resolvedesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/resolvedesk_test
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_postgres.py -q -rs
